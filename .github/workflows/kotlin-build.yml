name: Kotlin Native - Build & Test

on:
  push:
    paths:
      - 'kotlin-native/**'
      - '.github/workflows/kotlin-build.yml'
  pull_request:
    paths:
      - 'kotlin-native/**'
      - '.github/workflows/kotlin-build.yml'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Open a tmate SSH debug session on the runner after the emulator test step (emulator stays up until the job ends)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Assemble debug APK
        working-directory: kotlin-native
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hello-pablo-debug-apk
          path: kotlin-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

  instrumented-test:
    name: Instrumented test on emulator
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat -v threadtime > logcat.txt &
            gradle -p kotlin-native connectedDebugAndroidTest --stacktrace

      # Emulator teardown for this action runs as a post-job step, so the
      # emulator (and adb) are still alive for any step placed after this
      # one and before the job finishes - including the tmate step below.

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hello-pablo-instrumented-test-report
          path: |
            kotlin-native/app/build/reports/androidTests/connected/**
            kotlin-native/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 90

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hello-pablo-emulator-logcat
          path: logcat.txt
          if-no-files-found: warn
          retention-days: 90

      # Real, working debug step - inactive on every normal push/PR run.
      # Manually dispatch this workflow with debug=true to open an SSH
      # session into the runner while the emulator from the step above is
      # still up (teardown only happens once the whole job finishes).
      - name: Debug via tmate (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug == true }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
