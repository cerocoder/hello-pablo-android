org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Manual workaround, not a generated default: AGP 9 ships built-in Kotlin
# support that conflicts with applying the classic org.jetbrains.kotlin.android
# plugin explicitly (declared in settings.gradle.kts) — the same AGP9/Kotlin
# snag ticket 01 (kotlin-native) hit. Both flags are explicitly disabled here
# to keep the classic, non-built-in Kotlin plugin path.
android.newDsl=false
android.builtInKotlin=false
